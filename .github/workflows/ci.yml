name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_PATH: /zahraj-mi/

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  worker:
    name: AI worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ai-ui:
    name: AI reading UI (mocked Worker)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_AI_API_URL: https://ai.invalid
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/ai.spec.ts --project chromium
        env:
          AI_E2E: "1"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ai-ui-report
          path: test-results/
          retention-days: 14

  build:
    name: Build and end-to-end tests
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache recognition models
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/homr-models
          key: homr-models-${{ hashFiles('node_modules/homr-web/dist/models/manifest.js') }}
      - name: Download and verify models
        run: npm run models
      - run: npm run build
        env:
          # Empty unless the repository variable is set: then the invite-only AI reading is hidden.
          VITE_AI_API_URL: ${{ vars.AI_API_URL }}
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests in Chromium and WebKit (includes real note recognition)
        run: npm run test:e2e
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, worker, ai-ui]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
