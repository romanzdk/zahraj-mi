name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_PATH: /zahraj-mi/

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache recognition models
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/homr-models
          key: homr-models-${{ hashFiles('node_modules/homr-web/dist/models/manifest.js') }}
      - name: Download and verify models
        run: npm run models
      - run: npm run build
      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    name: End-to-end tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: webkit, browser: webkit }
          - { project: webkit-pages, browser: webkit }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache recognition models
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/homr-models
          key: homr-models-${{ hashFiles('node_modules/homr-web/dist/models/manifest.js') }}
      - name: Download and verify models
        run: npm run models
      - run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: End-to-end tests (includes real note recognition)
        run: npm run test:e2e -- --project ${{ matrix.project }}
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, build, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
